    safe_response: "FIXED in autonomous hardening cycle 8 (disclosed as an unfixed gap in cycle 7, revisited per a structured 7-question re-audit): connect_timeout_seconds (default 30s) routes a stalled CONNECTING attempt through the SAME _report_connection_lost funnel every other failure already uses -- no new state machine, inherits the existing generation-based dedup and bounded-reconnect-then-FAILED behavior."
    recovery: "automatic -- self-heals via the normal reconnect path instead of staying stuck in CONNECTING forever"
    safety_invariant: "Was never a safety gap (live/freshness.py's FreshnessPolicy already enforced STALE_DATA_NO_TRADE regardless), but WAS a genuine recovery-failure gap -- a silent hang previously blocked this module's reconnect machinery from ever engaging, requiring a manual restart to recover."
