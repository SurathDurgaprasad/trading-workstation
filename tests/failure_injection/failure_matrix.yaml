- id: FI-CANDLE-NONFINITE-TICK-NEVER-POISONS-STATE
  component: dhan_candle_builder
  failure: "a struct-decoded tick carries a NaN or +/-Inf price or volume (a legal IEEE-754 bit pattern from a corrupted/garbled packet) -- every prior validity comparison (price <= 0, deviation_pct > threshold) silently evaluates False against NaN/Inf, so the value previously passed every existing gate"
  injection_method: "CandleBuilder.on_tick() fed price=float('nan')/float('inf')/float('-inf') directly, parametrized, both as the very first tick and immediately after a real, valid baseline tick"
  expected:
    detection: true
    trade_authorization: N/A -- data-integrity finding in the live ingestion path, not a trade-authorization one
    safe_response: "FIXED, 2026-09-22 full-system red-team pass. A new, explicit math.isfinite(price)/math.isfinite(volume) check runs FIRST, before the non-positive-price/negative-volume/deviation checks -- the tick is rejected outright (rejected_tick_counts['non_finite_value']), never merges into close/high/low/volume, and never updates _last_known_price (closing the specific mechanism by which a NaN could otherwise permanently poison the deviation-plausibility gate for the rest of that CandleBuilder instance's life)."
    recovery: automatic -- the next valid tick is processed completely normally, proven directly (not merely assumed)
    safety_invariant: INVALID_DATA_NO_TRADE
  test: tests/test_dhan_candle_builder.py::test_non_finite_price_is_rejected_never_merged_into_a_bucket
  evidence_grade: B
  note: "A dedicated companion test (test_a_nan_price_never_permanently_poisons_the_deviation_gate_for_later_ticks) proves the poisoning mechanism specifically: sends a real baseline tick, a rejected NaN tick, then an actually-implausible (60% deviation) tick, and asserts the implausible tick is STILL correctly caught -- proving the NaN was never allowed to corrupt _last_known_price. Before this fix, a NaN tick would eventually reach OHLCVBar's own pydantic Field(gt=0) validation and raise an UNCAUGHT ValidationError -- a different exception type than the DhanWireFormatError the real WebSocket receive-thread callback (market_data_source.py) actually catches, a real crash risk on that thread. Full finding: docs/FULL_SYSTEM_RED_TEAM_2026-09-22.md, F2."

- id: FI-FLEET-WORKER-ALIVE-BUT-STUCK-NOW-DETECTED
  component: fleet_supervisor
  failure: "a worker process is technically alive (poll() returns None) but has stopped making real progress -- e.g. stuck inside a blocking call before it ever reaches its own per-bar print-and-heartbeat step. Before this fix, check_worker_health had NO time-based signal at all: process-exit check plus a log-content scan for gap/disconnect markers, neither with an age component, so a worker stuck AFTER printing an ordinary bar line was reported RUNNING indefinitely. Not hypothetical -- docs/DHAN_FEED_INTERRUPTION_1514_INVESTIGATION_2026-09-22.md documents the real 2026-09-17 incident this exact scenario describes."
  injection_method: "a WorkerHandle built with a real heartbeat.json artificially aged past the staleness threshold (via a controllable `now`), paired with ORDINARY (non-gap, non-disconnect) log lines that would previously have read as healthy"
  expected:
    detection: true
    health: "new WorkerHealth.UNRESPONSIVE status, checked BEFORE the log-content scan (a stale heartbeat is treated as decisive: whatever the log last showed is old news either way)"
    safe_response: "VISIBLE, not auto-recovered by design -- should_restart() deliberately never treats UNRESPONSIVE as a restart candidate, since the process object is still alive and this function has no authority to kill it; auto-recovery is an explicitly separate, larger decision left to a human operator or a future change, not made unsupervised"
    recovery: manual (operator must notice and act -- this fix's own scope is detection/visibility only)
    safety_invariant: NO_FALSE_HEALTH_SIGNAL
  test: tests/test_fleet_supervisor.py::test_check_worker_health_unresponsive_when_heartbeat_is_stale_even_with_ordinary_log_lines
  evidence_grade: B
  note: "Threshold (300s) deliberately reuses live/dhan/market_data_source.py's own already-justified connected_idle_timeout_seconds rather than inventing a new number. Backward-compatibility proven directly (test_check_worker_health_backward_compatible_when_heartbeat_path_is_none): a WorkerHandle built without heartbeat_path (every pre-existing caller/test) behaves byte-for-byte as before this fix -- the staleness check is a pure addition, never a behavior change for the untouched path. Full finding: docs/FULL_SYSTEM_RED_TEAM_2026-09-22.md, F3."

