    safe_response: "REAL RACE found and fixed in autonomous hardening cycle 15: submit_signal()'s own 'does a journal entry already exist' check and the transaction that inserts a new one are two separate steps (a classic check-then-act TOCTOU). The DB-level signals.signal_id PRIMARY KEY / journal_entries.signal_id UNIQUE constraint already prevented an actual DUPLICATE ROW from ever being created, but the LOSER of the race previously got a raw, uncaught sqlite3.IntegrityError instead of the documented 'return the existing result unchanged' idempotent behavior. Now caught and resolved: the loser re-reads and returns the winner's own already-committed JournalEntry."
    recovery: N/A -- both callers now correctly observe the SAME single result
    safety_invariant: CORRUPTED_STATE_NO_TRADE
