# Executable failure-injection matrix -- autonomous hardening cycle 7.
#
# This is NOT a second, competing documentation artifact alongside
# FINAL_FAILURE_MODE_ANALYSIS.md. That document is prose, written for a
# human reading top to bottom. This file is a machine-readable REGISTRY:
# every row's `test` field names a real pytest node id, and
# tests/failure_injection/test_matrix_integrity.py asserts, on every
# regression run, that the node id actually exists and is collectible --
# so this file can never silently drift into a stale claim the way prose
# documentation can. Every row must reference an ACTUAL test; a row with
# no working `test` value fails the integrity check, not just a human
# review.
#
# evidence_grade (see AUTONOMOUS LIMIT-PUSHING CONTROLLER mission,
# section 24):
#   A = real production-like execution (none in this project yet -- no
#       live Dhan credentials or real broker in this environment)
#   B = integration test with realistic infrastructure (a real temp
#       SQLite file, a real Signal/Account/CLI argv, a real restart)
#   C = deterministic simulation/injection (a mocked transport, an
#       injected fake failing function, a monkeypatched clock)
#   D = static inspection only (no automated test)
#   E = assumption, not independently verified
#
# Started with the highest-risk boundaries this campaign has already
# found and fixed real defects in (data quality, persistence, provider
# resilience, scheduler resilience, risk-engine safety, disk headroom).
# Expand incrementally in later cycles -- see this file's own "expand
# over subsequent cycles" note at the bottom before adding new rows.

